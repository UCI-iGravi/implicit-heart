name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Off-screen PyVista rendering (tests/test_visualize.py) needs OpenGL (also used by OpenCV) and a
      # virtual X display. libgl1 replaces libgl1-mesa-glx, which Ubuntu 24.04 dropped.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 xvfb
      - run: pip install -e ".[dev,viz]"
      - run: xvfb-run -a pytest -q
